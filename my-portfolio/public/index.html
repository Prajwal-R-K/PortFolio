<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Portfolio of Prajwal R K — Projects, skills, certificates, and ways to get in touch." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

    <script>
      // Apply saved theme class early to avoid FOUC, but only in dark mode
      (function() {
        try {
          var root = document.documentElement;
          var isDark = (localStorage.getItem('theme') === 'dark');
          var all = ['techy','minimal','neon']; // retro removed
          all.forEach(function(id){ root.classList.remove('theme-' + id); });
          if (isDark) {
            var t = localStorage.getItem('pref-theme') || 'techy';
            root.classList.add('theme-' + t);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prajwal R K — Portfolio" />
    <meta property="og:title" content="Prajwal R K — Portfolio" />
    <meta property="og:description" content="Projects, skills, certificates, and contact information." />
    <meta property="og:image" content="%PUBLIC_URL%/profile.jpg" />
    <meta property="og:url" content="https://prajwal-r-k.github.io/PortFolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prajwal R K — Portfolio" />
    <meta name="twitter:description" content="Projects, skills, certificates, and contact information." />
    <meta name="twitter:image" content="%PUBLIC_URL%/profile.jpg" />

    <title>Prajwal R K — Portfolio</title>
  </head>

    <div id="root"></div>
  </body>
